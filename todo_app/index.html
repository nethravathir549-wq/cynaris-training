<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px 20px;
        }

        .todo-container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .input-section {
            display: flex;
            gap: 10px;
        }

        #taskInput {
            flex: 1;
            padding: 10px;
        }

        #addButton {
            padding: 10px 15px;
            cursor: pointer;
        }

        #taskList {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #eee;
            border-radius: 5px;
        }

        .completed {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .delete-button {
            cursor: pointer;
            border: none;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

    <div class="todo-container">
        <h1>My To-Do List</h1>

        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
            >

            <button id="addButton">Add</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>

</body>
</html>
